name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          CODE=$(grep -oP '__version__ = "\K[^"]+' src/lanpad/__init__.py)
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          [ -n "$V" ] || V="$CODE"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux }
          - { os: macos-latest, target: macos-arm64 }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-xlib dpkg-dev

      - name: Build web client
        run: |
          cd web
          npm install
          npm run build

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6"
          if [ "$RUNNER_OS" = "Linux" ]; then pip install python-xlib; fi
          if [ "$RUNNER_OS" = "macOS" ]; then pip install pyobjc-core; fi
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/lanpad.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-deb.sh "$VERSION" amd64
          tar -C dist -czf "dist/lanpad-$VERSION-linux-x86_64.tar.gz" lanpad
          mkdir -p out && cp dist/*.deb dist/*.tar.gz out/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          tar -C dist -czf "out/lanpad-$VERSION-macos-arm64.tar.gz" lanpad

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\lanpad.iss
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist\LANpad-Setup-$env:VERSION.exe" out\
          Compress-Archive -Path dist\lanpad\* -DestinationPath "out\lanpad-$env:VERSION-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: LANpad v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          draft: false
          prerelease: false
          body: |
            ## LANpad v${{ env.VERSION }} — Cross-Platform LAN Trackpad & Keyboard

            - **Linux (Ubuntu/Debian):** Download `lanpad_${{ env.VERSION }}_amd64.deb` and install with `sudo apt install ./lanpad_${{ env.VERSION }}_amd64.deb`
            - **Windows:** Download and run `LANpad-Setup-${{ env.VERSION }}.exe` (or use the portable zip)
            - **macOS:** Download `lanpad-${{ env.VERSION }}-macos-arm64.tar.gz` (or install via Homebrew cask)
            - **Mobile:** Connect from your iOS or Android device using the Expo 58 app in `mobile/`

      - name: Refresh the landing page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml || true
