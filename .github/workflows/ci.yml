name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web client
        run: |
          cd web
          npm install
          npm run build

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: pip install python-xlib

      - name: Install LANpad
        run: pip install -e .

      - name: Run Architecture and Unit Tests
        run: python tests/run_all.py

      - name: CLI verify
        run: lanpad --help
