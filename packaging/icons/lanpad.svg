<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#334155" stroke-width="4" />

  <!-- Trackpad Outer Body -->
  <rect x="76" y="96" width="360" height="320" rx="36" fill="url(#padGrad)" stroke="#475569" stroke-width="3" filter="url(#shadow)" />

  <!-- Top Wireless Pulse Wave -->
  <path d="M 206 136 A 64 64 0 0 1 306 136" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 226 156 A 36 36 0 0 1 286 156" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <circle cx="256" cy="172" r="6" fill="#38bdf8" filter="url(#glow)" />

  <!-- Touchpad Surface Grid Accent / Gesture Zone -->
  <rect x="100" y="196" width="312" height="156" rx="20" fill="#0f172a" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Two-finger Touch Points -->
  <circle cx="220" cy="270" r="14" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="292" cy="270" r="14" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Swipe Motion trail -->
  <path d="M 180 270 Q 220 250 260 270 T 330 270" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Touchpad Button Divider -->
  <line x1="100" y1="368" x2="412" y2="368" stroke="#475569" stroke-width="2" />
  <line x1="256" y1="368" x2="256" y2="416" stroke="#475569" stroke-width="2" />
</svg>
